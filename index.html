<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>Vocab 練習</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 40px;
      text-align: center;
    }
    #card {
      font-size: 32px;
      margin: 20px 0;
    }
    input[type="text"] {
      font-size: 20px;
      padding: 8px;
      width: 300px;
    }
    button {
      font-size: 18px;
      padding: 8px 20px;
      margin-top: 10px;
      margin-left: 6px;
    }
    #result {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<h1>📘 Vocab 練習</h1>

<input type="file" id="fileInput" accept=".csv"><br><br>

<div id="card"></div>

<input type="text" id="answer" placeholder="輸入答案">
<br>
<button id="submitBtn" onclick="checkAnswer()">提交</button>
<button id="nextBtn" onclick="nextQuestion()" style="display:none">下一題</button>

<div id="result"></div>

<script>
let vocab = [];
let queue = [];
let current = null;
let direction = "";

// Utility: normalize and clean for storage/display
function cleanCell(cell) {
  if (typeof cell !== "string") return "";
  // remove BOM, normalize unicode (NFKC helps with full/half-width), trim
  return cell.replace(/\uFEFF/g, "").trim().normalize("NFKC");
}

// Utility: normalize for comparison (strip trailing punctuation like 。！？?.,、， and surrounding spaces)
function normalizeForCompare(s) {
  if (typeof s !== "string") return "";
  let t = s.replace(/\uFEFF/g, "").trim().normalize("NFKC");
  // remove common end punctuation (Japanese/Latin)
  t = t.replace(/[。！？?!.。，、]+$/u, "");
  // collapse internal spaces and trim again
  t = t.replace(/\s+/g, " ").trim();
  return t;
}

document.getElementById("fileInput").addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function() {
    // remove CRs, BOM and split lines
    const raw = String(reader.result).replace(/\r/g, "");
    const lines = raw.trim().split("\n").filter(l => l.trim().length > 0);
    if (lines.length === 0) {
      alert("檔案沒有內容或格式不對");
      return;
    }

    // detect delimiter: prefer tab if present; else comma
    const firstLine = lines[0];
    const delim = firstLine.includes("\t") && !firstLine.includes(",") ? "\t" : ",";

    vocab = lines.map(line => {
      const parts = line.split(delim).map(cell => cleanCell(cell));
      // ensure at least two columns; if only one column, try splitting by tab/comma fallback
      if (parts.length === 1 && delim === ",") {
        const alt = line.split("\t").map(cell => cleanCell(cell));
        if (alt.length > 1) return [alt[0], alt[1]];
      }
      return [parts[0] || "", parts[1] || ""];
    })
    // remove rows that don't have both sides
    .filter(pair => pair[0] && pair[1]);

    queue = [...vocab];
    document.getElementById("result").innerText = "";
    nextQuestion();
  };
  reader.readAsText(file, "UTF-8");
});

function nextQuestion() {
  // hide next button until after an answer is checked
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("submitBtn").disabled = false;
  document.getElementById("answer").disabled = false;

  if (queue.length === 0) {
    document.getElementById("card").innerText = "🎉 全部答啱晒！";
    document.getElementById("result").innerText = "";
    document.getElementById("submitBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("answer").style.display = "none";
    return;
  }

  const index = Math.floor(Math.random() * queue.length);
  current = queue[index];

  direction = Math.random() > 0.5 ? "CN" : "JP";

  document.getElementById("card").innerText =
    direction === "CN" ? current[0] : current[1];

  document.getElementById("answer").value = "";
  document.getElementById("result").innerText = "";
}

function checkAnswer() {
  if (!current) return;
  const input = document.getElementById("answer").value;
  const correct = direction === "CN" ? current[1] : current[0];

  const inputNorm = normalizeForCompare(input);
  const correctNorm = normalizeForCompare(correct);

  if (inputNorm === correctNorm) {
    document.getElementById("result").innerText = "✅ 啱咗！";
    // remove current item from queue (by identity)
    const idx = queue.indexOf(current);
    if (idx > -1) queue.splice(idx, 1);
  } else {
    document.getElementById("result").innerText =
      "❌ 錯咗！正確答案係：" + correct;
  }

  // show Next button; prevent resubmitting until next
  document.getElementById("nextBtn").style.display = "inline-block";
  document.getElementById("submitBtn").disabled = true;
  document.getElementById("answer").disabled = true;
}
</script>

</body>
</html>
